name: Release XIAOWOLoader

run-name: ${{ github.ref_name }} | XIAOWOLoader Release

on:
  push:
    tags:
      - 'xiaowo-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing xiaowo-v* tag to publish or repair
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Validate version tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Parse version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != xiaowo-v* ]]; then
            echo "Expected a tag beginning with xiaowo-v" >&2
            exit 1
          fi
          version="${RELEASE_TAG#xiaowo-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a tag such as xiaowo-v0.7.3-xiaowo.1" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows packages
    needs: version
    uses: ./.github/workflows/compile_windows.yml
    with:
      VERSION: ${{ needs.version.outputs.version }}
      SKIP_DEBUG: true

  publish:
    name: Publish GitHub release
    needs: [version, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: MelonLoader.Windows.x64.CI.Release
          path: staging/windows-x64

      - name: Download Windows x86 artifact
        uses: actions/download-artifact@v8
        with:
          name: MelonLoader.Windows.x86.CI.Release
          path: staging/windows-x86

      - name: Package release files
        shell: bash
        run: |
          mkdir -p packaged
          (cd staging/windows-x64 && zip -r ../../packaged/XIAOWOLoader.Windows.x64.zip .)
          (cd staging/windows-x86 && zip -r ../../packaged/XIAOWOLoader.Windows.x86.zip .)
          (cd packaged && sha256sum *.zip > SHA256SUMS.txt)

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" packaged/* --clobber
          else
            gh release create "$RELEASE_TAG" packaged/* \
              --verify-tag \
              --title "XIAOWOLoader ${{ needs.version.outputs.version }}" \
              --generate-notes
          fi
