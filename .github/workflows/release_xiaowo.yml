name: Release XIAOWOLoader

run-name: ${{ github.ref_name }} | XIAOWOLoader Release

on:
  push:
    tags:
      - 'xiaowo-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing xiaowo-v* tag to publish or repair
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Validate version tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Parse version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != xiaowo-v* ]]; then
            echo "Expected a tag beginning with xiaowo-v" >&2
            exit 1
          fi
          version="${RELEASE_TAG#xiaowo-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a tag such as xiaowo-v0.7.3-xiaowo.1" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows packages
    needs: version
    uses: ./.github/workflows/compile_windows.yml
    with:
      VERSION: ${{ needs.version.outputs.version }}
      SKIP_DEBUG: true

  publish:
    name: Publish GitHub release
    needs: [version, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: MelonLoader.Windows.x64.CI.Release
          path: staging/windows-x64

      - name: Download Windows x86 artifact
        uses: actions/download-artifact@v8
        with:
          name: MelonLoader.Windows.x86.CI.Release
          path: staging/windows-x86

      - name: Assemble full offline x64 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CPP2IL_VERSION: 2022.1.0-pre-release.21
        run: |
          set -euo pipefail

          cp -a staging/windows-x64 staging/windows-x64-offline
          dependencies="staging/windows-x64-offline/MelonLoader/Dependencies"
          generator="$dependencies/Il2CppAssemblyGenerator"
          unity_dir="$generator"
          mkdir -p "$generator/Cpp2IL/Plugins"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/LavaGang/PortableDotnet/raw/refs/heads/6.0.25/dotnet6.windows.x86_64.zip" \
            --output portable-dotnet.zip
          unzip -q portable-dotnet.zip -d "$dependencies"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/SamboyCoding/Cpp2IL/releases/download/$CPP2IL_VERSION/Cpp2IL-$CPP2IL_VERSION-Windows.exe" \
            --output "$generator/Cpp2IL/Cpp2IL.exe"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/SamboyCoding/Cpp2IL/releases/download/$CPP2IL_VERSION/Cpp2IL.Plugin.StrippedCodeRegSupport.dll" \
            --output "$generator/Cpp2IL/Plugins/Cpp2IL.Plugin.StrippedCodeRegSupport.dll"

          gh api --paginate \
            'repos/LavaGang/MelonLoader.UnityDependencies/releases?per_page=100' \
            --jq '.[] | select(.draft == false) | [.tag_name, (.assets[] | select(.name == "Managed.zip") | .browser_download_url)] | @tsv' \
            > unity-dependencies.tsv

          dependency_count="$(wc -l < unity-dependencies.tsv)"
          if [ "$dependency_count" -lt 800 ]; then
            echo "Expected at least 800 Unity dependency releases, found $dependency_count" >&2
            exit 1
          fi

          export UNITY_DIR="$unity_dir"
          while IFS=$'\t' read -r version url; do
            printf '%s\0%s\0' "$version" "$url"
          done < unity-dependencies.tsv | xargs -0 -n2 -P12 bash -c '
            set -euo pipefail
            version="$1"
            url="$2"
            if [[ ! "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
              echo "Unsafe Unity dependency version: $version" >&2
              exit 1
            fi
            curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
              "$url" --output "$UNITY_DIR/UnityDependencies_${version}.zip"
          ' _

          find "$unity_dir" -maxdepth 1 -name 'UnityDependencies_*.zip' -print0 \
            | xargs -0 -P8 -n1 unzip -tq
          actual_count="$(find "$unity_dir" -maxdepth 1 -name 'UnityDependencies_*.zip' | wc -l)"
          if [ "$actual_count" -ne "$dependency_count" ]; then
            echo "Unity dependency count mismatch: expected $dependency_count, found $actual_count" >&2
            exit 1
          fi

          touch "$generator/XIAOWO_OFFLINE_FULL"
          cp offline/README.zh-CN.txt staging/windows-x64-offline/XIAOWOLoader-离线版说明.txt

      - name: Package release files
        shell: bash
        run: |
          mkdir -p packaged
          (cd staging/windows-x64 && zip -r ../../packaged/XIAOWOLoader.Windows.x64.zip .)
          (cd staging/windows-x86 && zip -r ../../packaged/XIAOWOLoader.Windows.x86.zip .)
          (cd staging/windows-x64-offline && zip -r -1 ../../packaged/XIAOWOLoader.Windows.x64.Offline.Full.zip .)
          offline_size="$(stat -c '%s' packaged/XIAOWOLoader.Windows.x64.Offline.Full.zip)"
          if [ "$offline_size" -ge 2000000000 ]; then
            echo "Offline archive is too large for a GitHub release asset: $offline_size bytes" >&2
            exit 1
          fi
          (cd packaged && sha256sum *.zip > SHA256SUMS.txt)

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" packaged/* --clobber
          else
            gh release create "$RELEASE_TAG" packaged/* \
              --verify-tag \
              --title "XIAOWOLoader ${{ needs.version.outputs.version }}" \
              --generate-notes
          fi
